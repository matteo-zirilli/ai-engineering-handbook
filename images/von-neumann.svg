<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <rect x="20" y="20" width="250" height="170" rx="10" fill="#e8f0fb" stroke="#1a5fb4" stroke-width="2"/>
  <text x="145" y="45" text-anchor="middle" font-weight="bold">CPU</text>
  <rect x="40" y="60" width="210" height="50" rx="6" fill="#fff" stroke="#1a5fb4"/>
  <text x="145" y="82" text-anchor="middle">Control unit</text>
  <text x="145" y="100" text-anchor="middle" font-size="12">program counter (PC), registers</text>
  <rect x="40" y="122" width="210" height="50" rx="6" fill="#fff" stroke="#1a5fb4"/>
  <text x="145" y="144" text-anchor="middle">Arithmetic–logic unit</text>
  <text x="145" y="162" text-anchor="middle" font-size="12">+, −, ×, comparisons, logic</text>
  <rect x="370" y="20" width="250" height="170" rx="10" fill="#eaf6ee" stroke="#26a269" stroke-width="2"/>
  <text x="495" y="45" text-anchor="middle" font-weight="bold">Memory</text>
  <g font-family="monospace" font-size="12">
    <rect x="390" y="58" width="210" height="22" fill="#fff" stroke="#26a269"/><text x="398" y="74">0x00  instruction</text>
    <rect x="390" y="80" width="210" height="22" fill="#fff" stroke="#26a269"/><text x="398" y="96">0x01  instruction</text>
    <rect x="390" y="102" width="210" height="22" fill="#fff" stroke="#26a269"/><text x="398" y="118">  …   …</text>
    <rect x="390" y="124" width="210" height="22" fill="#fff" stroke="#26a269"/><text x="398" y="140">0xA0  data</text>
    <rect x="390" y="146" width="210" height="22" fill="#fff" stroke="#26a269"/><text x="398" y="162">0xA1  data</text>
  </g>
  <line x1="275" y1="90" x2="365" y2="90" stroke="#444" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="320" y="82" text-anchor="middle" font-size="12">bus</text>
  <rect x="170" y="230" width="300" height="50" rx="10" fill="#fdf1e3" stroke="#c64600" stroke-width="2"/>
  <text x="320" y="260" text-anchor="middle">Input / Output (keyboard, screen, disk, network)</text>
  <line x1="145" y1="195" x2="230" y2="228" stroke="#444" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="495" y1="195" x2="410" y2="228" stroke="#444" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
